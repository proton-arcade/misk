<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121212" />
    <title>Exst Arcade</title>
    <meta
      name="description"
      content=""
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Exst Arcade" />
    <meta property="og:title" content="ExstArcade" />
    <meta
      property="og:description"
      content=""
    />
    <meta
      property="og:image"
      content="website/assets/images/default-game.svg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ExstArcade" />
    <meta
      name="twitter:description"
      content=""
    />
    <meta
      name="twitter:image"
      content="website/assets/images/default-game.svg"
    />
    <link
      rel="icon"
      href="website/assets/images/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="website/assets/css/flix.css" />
  </head>
  <body class="flix">
    <noscript>
      <p style="padding: 1rem; text-align: center">
        Exst Arcade needs JavaScript to load its game library. Please enable
        JavaScript and reload this page.
      </p>
    </noscript>
    <a class="skip-link" href="#rows">Skip to games</a>

    <!-- Fixed header with red logo, like JuegoAmigo -->
    <header id="headerBar">
      <div class="header">
        <a class="logo" href="#home" aria-label="Exst Arcade home"
          >ExstArcade</a
        >
      </div>
    </header>

    <main id="pages">
      <!-- HOME: hero cover + poster rows -->
      <section class="flix-page" id="page-home" aria-label="Home">
        <div class="cover-wrapper">
          <div class="cover" id="heroCover"></div>
          <div class="hero-shade"></div>
          <div class="hero-content">
            <div class="hero-kicker" id="heroKicker">Spotlight</div>
            <h1 class="hero-title" id="heroTitle">Loading…</h1>
            <div class="hero-meta" id="heroMeta"></div>
            <p class="hero-overview" id="heroOverview"></p>
            <div class="categories" id="heroCategories"></div>
            <div class="options">
              <button class="play-btn" id="heroPlay" data-play="">
                <i data-icon="play"></i>Play
              </button>
              <button class="flat-btn" id="heroDetails" data-details="">
                <i data-icon="info"></i><span>Details</span>
              </button>
            </div>
            <div class="hero-dots" id="heroDots" role="group" aria-label="Featured games"></div>
          </div>
        </div>

        <!-- Populated when a catalog edit needs attention (see config-loader.js). -->
        <div id="catalogNotice"></div>

        <div id="rows" aria-live="polite"></div>

        <div class="about-box">
          <br />
          <br /><a href="#about"></a>
        </div>
      </section>

      <!-- SEARCH -->
      <section class="flix-page" id="page-search" aria-label="Search" hidden>
        <div class="flix-subpage">
          <h1>Search</h1>
          <p class="sub" id="searchCount">Loading the library…</p>
          <label class="search-bar">
            <i data-icon="search"></i>
            <input
              type="search"
              id="searchInput"
              placeholder="Search"
              aria-label="Search games"
              autocomplete="off"
            />
          </label>
          <div class="chip-row" role="group" aria-label="Filter by category">

          </div>
          <div class="sort-row">
            <i data-icon="sort"></i>
            <label for="sortSelect">Sort</label>
            <select id="sortSelect" aria-label="Sort games">

              <option value="az">Name: A–Z</option>
              <option value="played">Most played</option>
            </select>
          </div>
          <div class="search-grid" id="searchGrid" aria-live="polite"></div>
          <div class="empty-state" id="searchEmpty" hidden>
            <i data-icon="search"></i>
            <h3>No games found</h3>
            <p>Try another title or choose a different category.</p>
            <button class="primary-button" data-goto="#home">Explore games</button>
          </div>
        </div>
      </section>

      <!-- NOTIFICATIONS / WHAT'S NEW -->
      <section class="flix-page" id="page-notifications" aria-label="What's new"hidden>
        <div class="flix-subpage">
          
<div class="flix-row" id="recentRow" aria-live="polite"></div>
        </div>
      </section>

      <!-- ABOUT + PREFERENCES + COLLECTIONS -->
      <section class="flix-page" id="page-about" aria-label="About" hidden>
        <div class="flix-subpage">
          <h1>Prefs</h1>

          <div class="pref-block">
            <label for="openMode">Open game?</label>
            <select id="openMode">
              <option value="page">Open in the player</option>
              <option value="same">Replace this tab</option>
              <option value="new">Open game in a new tab</option>
            </select>
          </div>
          </button>
        </div>
      </section>
    </main>

    <!-- Fixed bottom icon bar -->
    <footer id="footerBar" aria-label="Site navigation">
      <button ref="home" class="active" aria-label="Home">
        <i data-icon="home"></i><span>Home</span>
      </button>
      <button ref="search" aria-label="Search">
        <i data-icon="search"></i><span>Search</span>
      </button>
      <button ref="about" aria-label="About">
        <i data-icon="info"></i><span>prefs</span>
      </button>
    </footer>

    <!-- Slide-in details page -->
    <div id="detailsPage" hidden role="dialog" aria-modal="true" aria-labelledby="detailsTitle">
      <header id="detailsHeader">
        <button id="detailsClose" aria-label="Back">
          <i data-icon="arrow_back"></i>
        </button>
        <h1 id="detailsHeadTitle"></h1>
      </header>
      <main>
        <div class="details-cover" id="detailsCover">
          <div class="background"></div>
          <h1 id="detailsTitle">Game title</h1>
        </div>
        <div class="details-body">
          <p id="detailsMeta" class="sub"></p>
          <div class="tag-row" id="detailsTags"></div>
          <p id="detailsOverview"></p>
          <div class="details-actions">
            <a class="ghost" id="detailsDirect" target="_blank" rel="noopener"
              ><i data-icon="arrow-up-right"></i>Direct link</a
            >
          </div>
        </div>
      </main>
      <footer>
        <button class="play-cta" id="detailsPlay" data-play="">
          <i data-icon="play"></i>Play
        </button>
      </footer>
    </div>

    <dialog id="infoDialog" class="arcade-dialog">
      <div class="dialog-header">
        <h2 id="dialogTitle"></h2>
        <button class="icon-button" id="closeDialog" aria-label="Close dialog">
          <i data-icon="x"></i>
        </button>
      </div>
      <div id="dialogContent"></div>
    </dialog>

    <dialog id="sectionsDialog" class="arcade-dialog spotlight-dialog" aria-labelledby="sectionsHeading">
      <div class="dialog-header">
        <h2 id="sectionsHeading">Edit home page sections</h2>
        <button class="icon-button" id="closeSections" type="button" aria-label="Close editor">×</button>
      </div>
      <div id="sectionsEditor" class="sections-editor"></div>
      <div class="spot-actions">
        <button class="primary-button" id="saveSections" type="button">Save changes</button>
      </div>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
    <script src="website/data/games.js"></script>
    <script src="website/data/folders.js"></script>
    <script src="website/assets/js/icons.js"></script>
    <script src="website/assets/js/config-loader.js"></script>
    <script src="website/assets/js/flix.js"></script>
  </body>
</html>
